name: fetch-daily-brief

on:
  schedule:
    - cron: "30 20 * * *" # 台灣時間 04:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch forecast and headlines
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python3 fetch.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brief.json
          git commit -m "update brief $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git push
